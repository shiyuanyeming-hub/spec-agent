# 一键起全栈：docker compose up --build
#
# LLM 配置从根目录 .env（或当前 shell 环境变量）读取，全部可选：
#   LLM_API_KEY=sk-xxx          # 留空 → Mock 模式（零配置可跑）
#   LLM_BASE_URL=https://api.deepseek.com/v1
#   LLM_MODEL=deepseek-chat
#   MAX_VALIDATION_ROUNDS=3

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      MAX_VALIDATION_ROUNDS: ${MAX_VALIDATION_ROUNDS:-3}
      CONSISTENCY_METHOD: ${CONSISTENCY_METHOD:-structural}
      CONSISTENCY_MIN_SCORE: ${CONSISTENCY_MIN_SCORE:-75}
      CONSISTENCY_BLOCKER_SCORE: ${CONSISTENCY_BLOCKER_SCORE:-50}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
